name: CI/CD Pipeline - Scraping Agaval

on:
  # ejecutar manualmente desde actions
  workflow_dispatch:
  
  #Automatización temporal
  schedule:
    - cron: '0 6 * * *'

jobs:
  run-scraping:
    runs-on: ubuntu-latest

    steps:
      #Descargar el código del repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      #Configurar Python
      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      #Instalar las librerias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml

      # Ejecutar el script de Python
      - name: Ejecutar Web Scraping de Celulares
        run: |
          python scraper.py

      #Guardar los resultados como artefacto descargable
      - name: Subir artefacto de datos
        uses: actions/upload-artifact@v4
        with:
          name: reporte-celulares-agaval
          path: output/*.csv
