name: CI/CD Pipeline - Scraping Agaval

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  run-scraping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml

      - name: Ejecutar Web Scraping de Celulares
        run: |
          python scraper.py

      - name: Subir artefacto de datos
        uses: actions/upload-artifact@v4
        with:
          name: reporte-celulares-agaval
          path: output/*.csv

      - name: Guardar CSV actualizado en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f output/productos_agaval_celulares_5_paginas.csv
          git diff --staged --quiet || git commit -m "chore: actualizar datos scraping celulares [skip ci]"
          git push
